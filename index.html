<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Baseball Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
	    <h1>My Baseball Game</h1>
    </header>

    <main>
        <section class="teams">
            <div>Away: [Away Team]</div>
            <div>Home: [Home Team]</div>
        </section>

        <section class="game-area">
            <h2>Baseball Field</h2>
            <p>The field will go here.</p>
        </section>


        <section class="scoreboard">
            <h2>Scoreboard</h2>
            <p>AWAY: 0</p>
            <p>HOME: 0</p>
            <p>INNING: 0</p>
            <p>OUTS: 0</p>
        </section>
    </main>

    <footer>
        <p>BALL: 0 | STRIKE: 0 | OUT: 0</p>
    </footer>


</body>

</html>
